name: agricast_app
description: AgriCAST - AI-Powered Climate-Adaptive Crop Recommendation System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  http: ^1.2.2
  
  # State Management
  provider: ^6.1.2
  
  # Charts
  fl_chart: ^0.69.0
  
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # PDF
  printing: ^5.13.1
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
